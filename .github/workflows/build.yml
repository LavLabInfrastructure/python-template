name: Build package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Hatch
        run: python -m pip install --upgrade hatch
      - name: Build wheel and source distribution
        run: hatch build
